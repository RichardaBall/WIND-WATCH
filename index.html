<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Watch</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            box-sizing: border-box;
            font-family: monospace;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #settings-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s, color 0.2s;
            opacity: 0.8;
            color: #ffffff;
        }
        #settings-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
        #settings-btn.active {
            color: #00ff00;
            opacity: 1.0;
        }
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
            color: #ffffff;
        }
        #fullscreen-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
        /* Unified Start & Loading Screen Overlay */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('loading-bg.webp');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease-out;
            color: #ffffff;
            font-family: monospace;
        }
        #start-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        #start-screen > * {
            position: relative;
            z-index: 2;
        }
        .loading-title {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 24px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        #load-game-btn {
            margin-top: 35px;
            padding: 18px 44px;
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            background: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        #load-game-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        }
        #loading-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 35px;
        }
        .progress-bar-container {
            width: 320px;
            height: 6px;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #9ca3af, #ffffff);
            transition: width 0.15s ease-out;
            box-shadow: 0 0 10px #ffffff;
        }
        #loading-status {
            margin-top: 15px;
            font-size: 13px;
            color: #f3f4f6;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
        }
        #copyright-notice {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            z-index: 100000;
            user-select: none;
            pointer-events: none;
            transition: opacity 0.6s ease-out;
        }
    </style>
    <!-- Import map for Three.js and addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Unified Start & Loading Screen Overlay -->
    <div id="start-screen">
        <div class="loading-title">Wind Watch</div>
        <button id="load-game-btn">START</button>
        <div id="loading-container">
            <div class="progress-bar-container">
                <div id="loading-progress"></div>
            </div>
            <div id="loading-status">Loading ... 0%</div>
        </div>
    </div>

    <!-- Copyright Notice -->
    <div id="copyright-notice">&copy; 2026 Richard Ball. All rights reserved.</div>

    <!-- Settings / Developer Button (Top Left) -->
    <button id="settings-btn" title="Settings / Developer Tool">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 10L3 3"></path>
            <path d="M3 9V3h6"></path>
            <path d="M14 10l7-7"></path>
            <path d="M15 3h6v6"></path>
            <path d="M10 14l-7 7"></path>
            <path d="M3 15v6h6"></path>
            <path d="M14 14l7 7"></path>
            <path d="M21 15v6h-6"></path>
        </svg>
    </button>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        const settingsBtn = document.getElementById('settings-btn');
        settingsBtn.addEventListener('click', () => {
            settingsBtn.classList.toggle('active');
            const event = new CustomEvent('toggle-settings', { detail: { active: settingsBtn.classList.contains('active') } });
            window.dispatchEvent(event);
        });

        const loadGameBtn = document.getElementById('load-game-btn');
        const startScreen = document.getElementById('start-screen');
        const loadingContainer = document.getElementById('loading-container');
        const copyrightNotice = document.getElementById('copyright-notice');

        if (loadGameBtn) {
            loadGameBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn(`Error attempting to enable fullscreen on start: ${err.message}`);
                    });
                }

                loadGameBtn.style.display = 'none';
                loadingContainer.style.display = 'flex';

                // Force render one frame immediately behind the loading screen so shaders/textures compile hidden
                if (window.game && window.game.renderer && window.game.scene && window.game.camera) {
                    window.game.renderer.render(window.game.scene, window.game.camera);
                }

                window.dispatchEvent(new CustomEvent('start-loading-game'));
            });
        }

        window.addEventListener('start-loading-game', () => {
            if (window.game && window.game.renderer && window.game.scene && window.game.camera) {
                window.game.renderer.compile(window.game.scene, window.game.camera);
            }

            if (window.game && window.game.player && window.game.player.audioManager) {
                window.game.player.audioManager.playLoadingMusic();
                window.game.player.audioManager.fadeOutLoadingMusic(0.5);
            }

            const progressBar = document.getElementById('loading-progress');
            const loadingStatus = document.getElementById('loading-status');

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 10;
                if (progress > 100) progress = 100;

                if (progressBar) progressBar.style.width = progress + '%';
                if (loadingStatus) loadingStatus.innerText = `Loading ... ${progress}%`;

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        if (startScreen) startScreen.style.opacity = '0';
                        if (copyrightNotice) copyrightNotice.style.opacity = '0';
                        setTimeout(() => {
                            if (startScreen) startScreen.style.display = 'none';
                            if (copyrightNotice) copyrightNotice.style.display = 'none';
                        }, 600);
                    }, 200);
                }
            }, 80);
        });
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
